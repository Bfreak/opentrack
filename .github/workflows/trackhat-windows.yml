name: Trackhat Windows (MSVC)

# Builds the Trackhat OpenTrack variant with MSVC, then produces:
#   - a portable zip of the install tree
#   - an Inno Setup installer (installer/opentrack-installer.iss)
# Both are uploaded as workflow artifacts.

on:
  push:
    branches: [ 'trackhat-*' ]
    tags: [ 'trackhat-*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.8.3'
  ORT_VERSION: '1.17.3'
  # Read by sdk-paths-runneradmin@MSVC-windows.cmake to locate the static OpenCV build
  opencv_tag: '4.10.0'
  OSCPACK_COMMIT: '3e7e3a1'

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0   # git describe needs tags for the version string

    - name: Fetch upstream release tag
      shell: bash
      run: |
        git tag -l | grep -q '^opentrack-2026.1.0$' || \
          git fetch --no-recurse-submodules https://github.com/opentrack/opentrack.git 'refs/tags/opentrack-2026.1.0:refs/tags/opentrack-2026.1.0'
        git describe --tags --always

    # SDKs for the Windows-only output protocols (vJoy, FSUIPC, ...) built by "proto-*";
    # paths are set in sdk-paths-runneradmin@MSVC-windows.cmake.
    - name: Checkout opentrack-depends
      uses: actions/checkout@v4
      with:
        repository: opentrack/opentrack-depends
        submodules: true
        path: opentrack-depends

    - name: MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Ninja comes with Visual Studio and is on PATH after vcvars.
    - name: Check Ninja
      run: ninja --version

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        dir: "${{ github.workspace }}/qt"
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2022_64
        modules: qtserialport qtmultimedia qtimageformats
        target: desktop
        cache: true

    - name: Install OpenCV (static)
      uses: cvpkg/opencv-action@main
      with:
        opencv_tag: ${{ env.opencv_tag }}
        BUILD_LIST: 'core,imgcodecs,imgproc,video,videoio,calib3d,highgui'
        BUILD_SHARED_LIBS: 'OFF'
        BUILD_WITH_STATIC_CRT: 'OFF'

    - name: Cache ONNX Runtime
      id: ort-cache
      uses: actions/cache@v4
      with:
        path: deps/onnxruntime-win-x64-${{ env.ORT_VERSION }}
        key: ort-win-x64-${{ env.ORT_VERSION }}

    - name: Download ONNX Runtime
      shell: pwsh
      run: |
        $v = $env:ORT_VERSION
        $dir = "$env:GITHUB_WORKSPACE/deps"
        "ORT_DIR=$dir/onnxruntime-win-x64-$v" | Out-File -Append $env:GITHUB_ENV
        if ("${{ steps.ort-cache.outputs.cache-hit }}" -eq 'true') { Write-Host 'cached'; exit 0 }
        New-Item -ItemType Directory -Force $dir | Out-Null
        $url = "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-$v.zip"
        for ($i = 1; $i -le 5; $i++) {
          try { Invoke-WebRequest $url -OutFile "$dir/ort.zip" -ErrorAction Stop; break }
          catch { Write-Host "attempt $i failed: $($_.Exception.Message)"; if ($i -eq 5) { throw }; Start-Sleep 20 }
        }
        Expand-Archive "$dir/ort.zip" -DestinationPath $dir

    - name: Build oscpack
      shell: pwsh
      run: |
        $deps = "$env:GITHUB_WORKSPACE/deps"
        git clone -q https://github.com/RossBencina/oscpack.git "$deps/oscpack-src"
        git -C "$deps/oscpack-src" checkout -q $env:OSCPACK_COMMIT
        $out = "$deps/oscpack"
        New-Item -ItemType Directory -Force "$out/obj", "$out/include/oscpack" | Out-Null
        Push-Location "$deps/oscpack-src"
        $srcs = @(Get-ChildItem osc/*.cpp) + @(Get-Item ip/IpEndpointName.cpp, ip/win32/NetworkingUtils.cpp, ip/win32/UdpSocket.cpp)
        cl /nologo /c /O2 /MD /EHsc /DOSC_HOST_LITTLE_ENDIAN=1 /DWIN32_LEAN_AND_MEAN /I. "/Fo$out/obj/" $srcs.FullName
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        # Fold the winsock/winmm import libs into oscpack.lib so proto-osc links without extra libs.
        lib /nologo "/OUT:$out/oscpack.lib" (Get-ChildItem "$out/obj/*.obj").FullName ws2_32.lib winmm.lib
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Copy-Item -Recurse osc, ip "$out/include/oscpack/"
        Pop-Location
        "OSCPACK_DIR=$out" | Out-File -Append $env:GITHUB_ENV

    - name: Configure
      shell: pwsh
      run: >
        cmake -G Ninja -S . -B build
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        "-DQt6_DIR=$env:QT_ROOT_DIR/lib/cmake/Qt6"
        "-DONNXRuntime_DIR=$env:ORT_DIR"
        "-DSDK_OSCPACK=$env:OSCPACK_DIR"

    - name: Build and install
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target install

    # Upstream's install only ships platforms/qwindows.dll. TLS is required for the
    # trackhat.org update check; same plugin set as the MinGW build.
    - name: Add Qt plugins
      shell: pwsh
      run: |
        $q = "$env:QT_ROOT_DIR/plugins"
        foreach ($p in 'tls/qschannelbackend.dll','imageformats/qico.dll','imageformats/qjpeg.dll','imageformats/qgif.dll','styles/qmodernwindowsstyle.dll') {
          $dst = Split-Path "build/install/$p"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$q/$p" $dst -ErrorAction Stop
        }

    - name: Add MSVC runtime DLLs (app-local)
      shell: pwsh
      run: |
        $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
        Write-Host "CRT from $($crt.FullName)"
        Copy-Item "$($crt.FullName)/*.dll" build/install/
        Get-ChildItem build/install -Recurse -Include *.exe,*.dll | ForEach-Object { $_.FullName.Substring((Resolve-Path build/install).Path.Length) }

    - name: Check DLL dependencies
      shell: pwsh
      run: |
        $inst = (Resolve-Path build/install).Path
        $have = @{}
        Get-ChildItem $inst -Recurse -Filter *.dll | ForEach-Object { $have[$_.Name.ToLower()] = 1 }
        $missing = @{}
        Get-ChildItem $inst -Recurse -Include *.exe,*.dll | ForEach-Object {
          $f = $_.FullName
          dumpbin /nologo /dependents $f | Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object {
            $d = $_.Matches[0].Groups[1].Value.ToLower()
            $sys = Test-Path "$env:WINDIR/System32/$d"
            if (-not $have.ContainsKey($d) -and -not $sys -and -not $d.StartsWith('api-ms-') -and -not $d.StartsWith('ext-ms-')) {
              $missing["$d (needed by $($f.Substring($inst.Length)))"] = 1
            }
          }
        }
        if ($missing.Count) { Write-Host "::warning::Possibly missing DLLs:`n$($missing.Keys -join "`n")" } else { Write-Host 'All DLL dependencies resolved.' }

    - name: Version
      id: ver
      shell: bash
      run: |
        v=$(sed -n 's/.*OPENTRACK_VERSION *"\(.*\)".*/\1/p' build/opentrack-version.hxx | head -1)
        echo "Version: $v"
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Build installer (Inno Setup)
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
        & $iscc /O"$env:GITHUB_WORKSPACE/dist" installer/opentrack-installer.iss
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Get-ChildItem dist

    - name: Portable zip
      shell: pwsh
      run: Compress-Archive -Path build/install/* -DestinationPath "dist/${{ steps.ver.outputs.version }}-win64-portable.zip"

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.ver.outputs.version }}-installer
        path: dist/*.exe

    - name: Upload portable zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.ver.outputs.version }}-portable
        path: dist/*.zip
